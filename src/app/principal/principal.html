<!-- Formulário -->
<form>
  <input type="hidden">
  <input type="text"   placeholder="Digite seu nome" class="form-control">
  <input type="number" placeholder="nota1" class="form-control">
  <input type="number" placeholder="nota2" class="form-control">

  <input type="button" value="Cadastrar" class="btn btn-primary">
  <input type="button" value="Alterar" class="btn btn-warning">
  <input type="button" value="Remover" class="btn btn-danger">
  <input type="button" value="Cancelar" class="btn btn-secondary">
</form>

<!-- Tabela de resultados -->
 <table class="table table-striped table-hover">
    <thead>
        <tr>
            <th>#</th>
            <th>Nome</th>
            <th>Nota 1</th>
            <th>Nota 2</th>
            <th>Média</th>
            <th>Selecionar</th>
        </tr>
    </thead>

    <tbody>

    </tbody>
 </table>
